# Accepted-risk exceptions for cmd/govulncheckgate.
#
# A call-graph-reachable finding from `govulncheck -format json` is allowed
# through the CI gate ONLY if every field below matches AND `expires` is in
# the future. Anything else (unlisted finding, module/package mismatch,
# expired entry) fails CI — see cmd/govulncheckgate.
exceptions:
  - id: GO-2026-5932
    module: golang.org/x/crypto
    package: golang.org/x/crypto/openpgp
    reason: >-
      Upstream has no fix (x/crypto/openpgp is unmaintained and unsafe by
      design). Reachable via github.com/containers/image/v5/signature's
      mechanism.go, which unconditionally imports x/crypto/openpgp for a
      frozen legacy signature-format code path regardless of the
      containers_image_openpgp build tag (that tag only selects the
      gpgme-vs-openpgp DEFAULT signing mechanism; mechanism.go's own use is
      separate and always compiled in). podbridge5 never invokes that legacy
      decode path directly; govulncheck's static reachability still flags it
      because it's linked. No actionable fix until containers/image drops
      the legacy path upstream. Same finding, same root cause NodeVault
      accepted for its own (indirect, via podbridge5) call graph — see
      NodeVault's security/govulncheck-exceptions.yaml.
    owner: "HeaInSeo"
    expires: "2026-10-16"
    tracking_issue: "https://github.com/HeaInSeo/podbridge5/issues/4"
