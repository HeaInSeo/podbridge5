name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# ── 실행 환경 ─────────────────────────────────────────────────────
# gh CLI 호출만 하는 가벼운 job이라 GitHub-hosted 러너를 사용 (CodeQL과 동일).
# ─────────────────────────────────────────────────────────────────

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build release notes from Readme.md changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          LINE="$(grep -F -- "- \`${TAG}\` — " Readme.md || true)"
          if [ -z "$LINE" ]; then
            echo "::error::Readme.md 변경 이력(## 변경 이력)에 ${TAG} 항목이 없습니다. changelog를 추가한 뒤 태그를 다시 푸시하세요." >&2
            exit 1
          fi
          ENTRY="${LINE#*— }"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "## 변경 사항"
            echo
            echo "- ${ENTRY}"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-notes.md

      - name: Create release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
