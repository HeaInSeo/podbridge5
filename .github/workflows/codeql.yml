name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "31 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TAGS: "exclude_graphdriver_btrfs exclude_graphdriver_devicemapper"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure CGo system dependencies
        if: matrix.language == 'go'
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Go packages
        if: matrix.language == 'go'
        run: |
          go build -tags "${BUILD_TAGS}" ./...
          if [ -f hack/remotevm/go.mod ]; then
            (cd hack/remotevm && go build ./...)
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
