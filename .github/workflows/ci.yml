name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── 실행 환경 ─────────────────────────────────────────────────────
# 모든 job을 self-hosted runner에서 실행 → GitHub Actions 요금 0원.
# 러너: Rocky Linux 8 원격 장비(100.123.80.48)에 설치된 podbridge5-runner
# ─────────────────────────────────────────────────────────────────

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TAGS: "exclude_graphdriver_btrfs exclude_graphdriver_devicemapper"
  GO_VERSION_FILE: go.mod

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. 린트 (gosec 포함)
  # ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (golangci-lint + gosec)
    runs-on: [self-hosted, linux, podbridge5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # 절대경로로 패키지 매니저를 확인 (PATH 순서에 의존하는 command -v 대신)
      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      # install-mode: goinstall — 시스템 Go(1.25.5)로 소스 빌드.
      # 바이너리 릴리스는 go1.24로 빌드돼 go1.25.5 프로젝트를 처리 못함.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: >-
            --build-tags "${{ env.BUILD_TAGS }}"
            --timeout 10m

  # ────────────────────────────────────────────────────────────────
  # 2. 빌드 검증
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, linux, podbridge5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: go build
        run: go build -tags "${{ env.BUILD_TAGS }}" ./...

      - name: go vet
        run: go vet -tags "${{ env.BUILD_TAGS }}" ./...

      # Compile-only check for runtime/integration-tagged test files. These
      # never run in test-unit (no live Podman socket / VM here), so without
      # this they can silently bit-rot and reference removed/renamed symbols
      # until someone runs them on the remote VM (see make vm-test-runtime).
      - name: go vet (runtime + integration build tags)
        run: go vet -tags "${{ env.BUILD_TAGS }} runtime integration" ./...

  # ────────────────────────────────────────────────────────────────
  # 3. 유닛 테스트 (podman/buildah 런타임 불필요)
  # ────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: [self-hosted, linux, podbridge5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: go test (unit, -race, -cover)
        run: |
          go test \
            -v \
            -race \
            -cover \
            -coverprofile=coverage.out \
            -tags "${{ env.BUILD_TAGS }}" \
            ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 14

  # ────────────────────────────────────────────────────────────────
  # 4. 취약점 스캔 (Go vuln DB)
  # ────────────────────────────────────────────────────────────────
  vuln-scan:
    name: Vulnerability Scan (govulncheck)
    runs-on: [self-hosted, linux, podbridge5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Ensure CGo system dependencies
        run: |
          if [ -x /usr/bin/dnf ]; then
            sudo /usr/bin/dnf install -y --enablerepo=powertools \
              gpgme-devel libassuan-devel device-mapper-devel \
              libseccomp-devel pkgconf-pkg-config
          elif [ -x /usr/bin/apt-get ]; then
            sudo /usr/bin/apt-get update -q
            sudo /usr/bin/apt-get install -y --no-install-recommends \
              libgpgme-dev libassuan-dev libbtrfs-dev \
              libdevmapper-dev libseccomp-dev pkg-config
          else
            echo "Unsupported package manager" >&2; exit 1
          fi

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags "${{ env.BUILD_TAGS }}" ./...
